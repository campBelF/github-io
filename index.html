<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Your Name</title>
  <style>
    :root{--bg:#0f1724;--card:#0b1220;--accent:#06b6d4;--muted:#94a3b8}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;background:var(--bg);color:#e6eef6;display:flex;min-height:100vh;align-items:center;justify-content:center}
    .card{background:linear-gradient(180deg,rgba(255,255,255,0.02),transparent);padding:28px;border-radius:12px;box-shadow:0 6px 30px rgba(2,6,23,0.6);max-width:780px;width:92%;text-align:left}
    h1{margin:0 0 6px;font-size:28px}
    p{margin:0 0 14px;color:var(--muted)}
    .links{display:flex;flex-wrap:wrap;gap:10px}
    a.btn{background:var(--card);color:#e6eef6;padding:10px 14px;border-radius:10px;text-decoration:none;border:1px solid rgba(255,255,255,0.03);transition:transform .12s ease,box-shadow .12s ease}
    a.btn:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(6,182,212,0.08);border-color:rgba(6,182,212,0.14)}
    footer{margin-top:16px;color:var(--muted);font-size:13px}
  </style>
</head>
<body>
  <main class="card">
    <h1>Your Name</h1>
    <p>Short tagline or one-sentence description about you.</p>

    <div class="links">
      <a class="btn" href="mailto:you@example.com">Email</a>
      <a class="btn" href="https://your-portfolio.example" target="_blank" rel="noopener">Portfolio</a>
      <a class="btn" href="https://linkedin.com/in/yourprofile" target="_blank" rel="noopener">LinkedIn</a>
    </div>

    <footer>
      Built with GitHub Pages — replace links and text with your info.
    </footer>
  </main>
</body>
</html>
